<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyFlow — bản duyệt</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#596170;--line:#ced6e2;--blue:#3156d3;--dark:#111722;--green:#08724f;--red:#b92f39;--violet:#6648bf;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input{font:inherit}.notice{padding:8px 16px;background:#fff4d9;border-bottom:1px solid #e3c887;color:#634a13;text-align:center;font-size:12px;font-weight:700}.wrap{width:min(calc(100% - 36px),1180px);margin:auto}.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:820}.mark{width:29px;height:29px;display:grid;place-items:center;border:2px solid;border-radius:50%;font:800 13px ui-monospace}.top{position:sticky;top:0;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}.nav{min-height:70px;display:flex;align-items:center;gap:28px}.links{display:flex;gap:24px;color:var(--muted);font-size:14px}.actions{margin-left:auto;display:flex;gap:10px}.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border:1px solid var(--dark);background:var(--dark);color:#fff;font-weight:760}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.hero{min-height:calc(100svh - 104px);display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(48px,7vw,96px);align-items:center;padding:70px 0}.eyebrow{color:var(--blue);font:750 12px ui-monospace;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:16px 0 0;font-size:clamp(52px,6.6vw,88px);letter-spacing:-.065em;line-height:.94}.hero h1 span{display:block;color:var(--blue)}.lead{max-width:620px;margin:24px 0 0;color:var(--muted);font-size:19px;line-height:1.65}.hero-actions{display:flex;gap:12px;margin-top:30px}.small-note{margin-top:22px;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}.ledger{border:2px solid var(--ink);background:var(--card);box-shadow:12px 12px 0 var(--line)}.ledger-head,.balance,.row,.ledger-foot{padding:16px 20px}.ledger-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink)}.ledger-head small,.balance span,.balance small,.row small,.ledger-foot{color:var(--muted)}.balance{display:grid;gap:4px;background:#eef1f6;border-bottom:1px solid var(--line)}.balance strong{font:800 34px ui-monospace}.row{display:grid;grid-template-columns:1fr auto;gap:18px;border-bottom:1px solid var(--line)}.row strong,.row small{display:block}.row small{margin-top:4px;font-size:12px}.amount{font:700 13px ui-monospace}.income{color:var(--green)}.expense{color:var(--red)}.transfer{color:var(--violet)}.ledger-foot{font-size:11px}.section{border-top:1px solid var(--line);padding:80px 0}.section h2{max-width:760px;margin:18px 0 0;font-size:clamp(38px,5vw,64px);letter-spacing:-.055em;line-height:1}.grid{margin-top:42px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--card)}.grid article{min-height:220px;padding:26px;border-left:1px solid var(--line)}.grid article:first-child{border-left:0}.grid b{color:var(--blue);font:750 11px ui-monospace}.grid h3{margin:58px 0 0;font-size:21px}.grid p{color:var(--muted);line-height:1.6}.final{margin-bottom:70px;padding:48px;background:var(--dark);color:#fff}.final h2{max-width:720px;margin:0;font-size:clamp(38px,5vw,62px);letter-spacing:-.055em}.final div{display:flex;justify-content:space-between;align-items:end;gap:30px}.final .btn{background:#fff;color:var(--dark)}.auth{min-height:calc(100svh - 34px);display:grid;grid-template-columns:.82fr 1.18fr}.context{display:flex;flex-direction:column;padding:clamp(30px,4vw,58px);background:var(--dark);color:#fff}.context-copy{margin-top:12vh}.context h2{margin:18px 0 0;font-size:clamp(42px,5vw,70px);letter-spacing:-.06em;line-height:.98}.context p{color:#bcc5d0;line-height:1.7}.mini{margin-top:46px;border:1px solid #536070}.mini .row{border-color:#374151}.form-side{display:grid;place-items:center;padding:46px}.form-card{width:min(100%,500px)}.back{display:inline-flex;min-height:44px;align-items:center;margin-bottom:30px;color:var(--muted)}.form-card h1{margin:10px 0 0;font-size:clamp(38px,4.5vw,54px);letter-spacing:-.055em}.desc{color:var(--muted);line-height:1.6}.google,.submit{width:100%;min-height:52px;border:1px solid var(--line);background:var(--card);font-weight:720}.submit{background:var(--dark);color:#fff;border-color:var(--dark)}.divider{margin:20px 0;color:var(--muted);text-align:center;font-size:12px}.form{display:grid;gap:16px}.field{display:grid;gap:7px;font-size:12px;font-weight:700}.field input{min-height:52px;border:1px solid #aeb8c7;background:var(--card);padding:0 14px}.field-top{display:flex;justify-content:space-between}.field-top a,.switch a{color:var(--blue)}.password{position:relative}.password input{width:100%;padding-right:70px}.toggle{position:absolute;right:4px;top:4px;min-width:58px;min-height:44px;border:0;background:#eef1f6}.privacy{display:flex;gap:10px;color:var(--muted);font-size:13px}.switch{text-align:center;color:var(--muted);font-size:13px}.fake{display:none;margin-bottom:16px;padding:12px;background:#eaf6ec;border:1px solid #a8c8ae;color:#204c28;font-size:13px}.fake.show{display:block}@media(max-width:850px){.hero,.auth{grid-template-columns:1fr}.context{min-height:72px;padding:12px 20px}.context-copy,.mini{display:none}.form-side{padding:28px 18px 52px}.links{display:none}}@media(max-width:680px){.hero{padding:54px 0}.hero h1{font-size:clamp(48px,15vw,64px)}.hero-actions,.final div{flex-direction:column;align-items:stretch}.hero-actions .btn,.final .btn{width:100%}.grid{grid-template-columns:1fr}.grid article{min-height:auto;border-left:0;border-top:1px solid var(--line)}.grid article:first-child{border-top:0}.grid h3{margin-top:28px}.final{padding:32px}.actions>a:first-child{display:none}}</style></head><body><div class="notice">Bản duyệt thiết kế · Không phải production · Form không gửi dữ liệu thật</div><div id="app"></div><script>const data=[['Lương tháng 8','Tài khoản chính','+15.000.000 ₫','income'],['Tiền nhà','Tài khoản chính','-4.500.000 ₫','expense'],['Chuyển sang ví chi tiêu','Nội bộ','1.500.000 ₫','transfer'],['Cà phê sáng','Ví tiền mặt','-35.000 ₫','expense']];const logo='<span class="mark">M</span><span>MoneyFlow</span>';function rows(limit=4){return data.slice(0,limit).map(x=>`<div class="row"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><b class="amount ${x[3]}">${x[2]}</b></div>`).join('')}function landing(){return `<header class="top"><nav class="nav wrap"><a class="brand" href="#/">${logo}</a><div class="links"><a href="#how">Cách hoạt động</a><a href="#data">Dữ liệu của bạn</a></div><div class="actions"><a href="#/login">Đăng nhập</a><a class="btn" href="#/register">Dùng thử</a></div></nav></header><main><section class="hero wrap"><div><p class="eyebrow">Sổ thu chi cá nhân</p><h1>Ghi một lần.<span>Cuối tháng khỏi đoán.</span></h1><p class="lead">Mỗi khoản thu, chi hay chuyển tiền đều nằm đúng tài khoản. Cần kiểm tra khoản nào thì mở lại khoản đó.</p><div class="hero-actions"><a class="btn" href="#/register">Bắt đầu ghi thu chi</a><a class="btn alt" href="#/login">Tôi đã có tài khoản</a></div><p class="small-note">Bạn tự ghi dữ liệu cần thiết. MoneyFlow không cần mật khẩu ngân hàng.</p></div><div class="ledger"><div class="ledger-head"><strong>Sổ giao dịch · Tháng 8</strong><small>Dữ liệu minh hoạ</small></div><div class="balance"><span>Tổng số dư</span><strong>18.715.000 ₫</strong><small>3 tài khoản đang hoạt động</small></div>${rows()}<div class="ledger-foot">Chuyển nội bộ không tính vào chi tiêu</div></div></section><section class="section wrap" id="how"><p class="eyebrow">Cách hoạt động</p><h2>Một khoản tiền đi qua ba bước.</h2><div class="grid">${[['01','Ghi khoản vừa phát sinh','Chọn thu, chi hoặc chuyển tiền; nhập số tiền và tài khoản.'],['02','Số dư tự cập nhật','MoneyFlow tính từ sổ giao dịch, không bắt bạn sửa số dư bằng tay.'],['03','Cần thì mở lại','Tìm, sửa hoặc phục hồi đúng giao dịch khiến con số thay đổi.']].map(x=>`<article><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section class="section wrap" id="data"><p class="eyebrow">Dữ liệu của bạn</p><h2>Dữ liệu của bạn vẫn là dữ liệu của bạn.</h2><div class="grid">${[['Nhập dữ liệu','Bạn quyết định khoản nào được ghi vào MoneyFlow.'],['Kiểm tra lại','Mỗi số tổng đều quay về được đúng giao dịch tạo ra nó.'],['Đem dữ liệu đi','Xuất CSV để tự lưu, kiểm tra hoặc tiếp tục xử lý.']].map((x,i)=>`<article><b>0${i+1}</b><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div></section><section class="final wrap"><div><h2>Tạo sổ rồi ghi khoản đầu tiên.</h2><a class="btn" href="#/register">Dùng thử MoneyFlow</a></div></section></main>`}const copy={login:['Đăng nhập','Mở lại sổ của bạn','Dùng Google hoặc email đã đăng ký.','Đăng nhập','Chưa có tài khoản?','Tạo tài khoản','#/register'],register:['Tạo tài khoản','Bắt đầu một sổ mới','Tạo tài khoản rồi ghi khoản đầu tiên. Không cần liên kết ngân hàng.','Tạo tài khoản','Đã có tài khoản?','Đăng nhập','#/login'],'forgot-password':['Khôi phục tài khoản','Quên mật khẩu?','Nhập email đã đăng ký. MoneyFlow sẽ gửi link để bạn đặt lại.','Gửi liên kết','','← Quay lại đăng nhập','#/login']};function auth(name){const c=copy[name]||copy.login;const reg=name==='register',forgot=name==='forgot-password';return `<main class="auth"><aside class="context"><a class="brand" href="#/">${logo}</a><div class="context-copy"><p class="eyebrow">${c[0]}</p><h2>${reg?'Không cần nhập cả cuộc đời tài chính trong ngày đầu.':forgot?'Chỉ cần email đã đăng ký.':'Đăng nhập rồi xem tiếp từ khoản gần nhất.'}</h2><p>Giao dịch và tài khoản vẫn theo đúng dữ liệu bạn đã ghi.</p></div>${forgot?'':`<div class="mini">${rows(3)}</div>`}</aside><section class="form-side"><div class="form-card"><a class="back" href="#/">← Trang chủ</a><p class="eyebrow">${c[0]}</p><h1>${c[1]}</h1><p class="desc">${c[2]}</p><div id="fake" class="fake">Đây là bản duyệt giao diện. Form chưa gửi dữ liệu thật.</div>${forgot?'':`<button class="google" type="button">Tiếp tục với Google</button><div class="divider">hoặc dùng email</div>`}<form class="form" id="form">${reg?'<label class="field">Họ và tên<input placeholder="Nguyễn Minh Anh"></label>':''}<label class="field">Email<input type="email" placeholder="ban@example.com"></label>${forgot?'':`<label class="field"><span class="field-top"><span>Mật khẩu</span>${name==='login'?'<a href="#/forgot-password">Quên mật khẩu?</a>':''}</span><span class="password"><input id="pw" type="password" placeholder="${reg?'Ít nhất 12 ký tự':'Nhập mật khẩu'}"><button class="toggle" id="toggle" type="button">Hiện</button></span></label>`}${reg?'<label class="privacy"><input type="checkbox">Tôi đồng ý với chính sách quyền riêng tư</label>':''}<button class="submit" type="submit">${c[3]}</button></form><p class="switch">${c[4]} <a href="${c[6]}">${c[5]}</a></p></div></section></main>`}function bind(){document.querySelector('.google')?.addEventListener('click',()=>fake.classList.add('show'));document.querySelector('#form')?.addEventListener('submit',e=>{e.preventDefault();fake.classList.add('show')});document.querySelector('#toggle')?.addEventListener('click',e=>{pw.type=pw.type==='password'?'text':'password';e.target.textContent=pw.type==='password'?'Hiện':'Ẩn'})}function render(){const name=location.hash.replace(/^#\/?/,'');app.innerHTML=name?auth(name):landing();scrollTo(0,0);bind()}addEventListener('hashchange',render);render();</script></body></html>
