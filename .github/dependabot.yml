version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      web-runtime:
        patterns:
          - next
          - react
          - react-dom
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - react-dom
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7
      include:
        - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
