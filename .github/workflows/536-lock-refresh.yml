name: 536 lock refresh

on:
  push:
    branches:
      - security/536-runtime-dependency-patch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Resolve active plan
        run: npm run plan:resolve
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact tree
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - name: Agent preflight after runner bootstrap
        run: npm run agent:doctor -- --json
      - name: Audit exact tree
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('npm audit vulnerability counts:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            if (item.severity === 'high' || item.severity === 'critical') {
              console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, via: item.via, range: item.range, fixAvailable: item.fixAvailable }));
            }
          }
          NODE
          echo "npm audit exit code: $audit_exit"
      - name: Verify package manifest stayed unchanged
        run: git diff --exit-code -- package.json
      - name: Show lockfile delta
        run: git diff --stat -- package-lock.json && git diff -- package-lock.json | sed -n '1,260p'
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): refresh patched runtime lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
