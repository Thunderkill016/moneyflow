name: tmp #536 exact audit

on:
  push:
    branches:
      - security/536-runtime-dependency-patch

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - run: npm ci
      - name: Exact audit JSON
        run: |
          npm audit --json > audit.json || true
          cat audit.json
          node -e 'const a=require("./audit.json"); const v=a.metadata?.vulnerabilities??{}; console.log("AUDIT_COUNTS", JSON.stringify(v)); if ((v.high??0)+(v.critical??0)>0) process.exit(1)'
      - name: Commit regenerated lockfile
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): resolve fast-uri advisory"
          git push origin HEAD:security/536-runtime-dependency-patch
