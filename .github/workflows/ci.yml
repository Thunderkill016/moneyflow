name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Fresh local reset and pgTAP
        id: database-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            supabase --version
            supabase db start
            supabase db reset --local
            supabase test db
          } 2>&1 | tee database-test-output.log
      - name: Upload failing database output
        if: steps.database-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-database-test-output
          path: database-test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
      - name: Fail after preserving database diagnostics
        if: steps.database-tests.outcome == 'failure'
        run: exit 1
      - name: Database test summary
        if: steps.database-tests.outcome == 'success'
        run: tail -n 80 database-test-output.log

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Deployment configuration contract
        run: npm run check:deployment-env
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and static RLS
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run test > test-output.log 2>&1
      - name: Upload failing test output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving diagnostics
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Test summary
        if: steps.tests.outcome == 'success'
        run: tail -n 40 test-output.log
      - name: Production build
        run: npm run build

  emergency-prebuilt-production-deploy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.head_ref == 'agent/emergency-prebuilt-deploy'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout verified main content
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify deployment credential availability
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi
      - name: Install application dependencies
        run: npm ci
      - name: Link MoneyFlow project when IDs are unavailable
        shell: bash
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            npx --yes vercel@latest link \
              --yes \
              --project moneyflow \
              --scope thunderkill016s-projects \
              --token "$VERCEL_TOKEN"
          fi
      - name: Set explicit production app mode in Vercel
        shell: bash
        run: |
          printf '%s\n' authenticated | npx --yes vercel@latest env add \
            NEXT_PUBLIC_APP_MODE production --force --token "$VERCEL_TOKEN"
      - name: Pull production project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Export Production environment for local build
        run: npx --yes vercel@latest env pull .env.local --environment=production --yes --token "$VERCEL_TOKEN"
      - name: Validate exported Production environment
        id: production-env-validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -a
            . ./.env.local
            set +a
            VERCEL=1 VERCEL_ENV=production node scripts/check-deployment-env.mjs --force
          } 2>&1 | tee production-env-validation.log
      - name: Upload failing Production env validation
        if: steps.production-env-validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-production-env-validation
          path: production-env-validation.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving Production env diagnostics
        if: steps.production-env-validation.outcome == 'failure'
        run: exit 1
      - name: Create temporary Vercel CI configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          config.buildCommand = 'set -a; . ./.env.local; set +a; npm run check:deployment-env && npm run build';
          fs.writeFileSync('vercel.ci.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Build production output with exported Production env
        id: vercel-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest build --prod \
            --local-config vercel.ci.json \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee vercel-build-output.log
      - name: Upload failing Vercel build output
        if: steps.vercel-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-vercel-build-output
          path: vercel-build-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving Vercel diagnostics
        if: steps.vercel-build.outcome == 'failure'
        run: exit 1
      - name: Deploy prebuilt output to production
        shell: bash
        run: |
          deployment_url=$(npx --yes vercel@latest deploy \
            --prebuilt \
            --prod \
            --archive=tgz \
            --yes \
            --token "$VERCEL_TOKEN")
          echo "Production deployment: $deployment_url"
