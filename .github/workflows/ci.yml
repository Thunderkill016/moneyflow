name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Draft state deliberately gates nothing here.
#
# Jobs used to carry
#   github.event_name != 'pull_request'
#     || github.event.action == 'ready_for_review'
#     || github.event.pull_request.draft == false
# in eight places. That reads the draft flag out of the run's own event payload,
# which can already be stale: opening a pull request as a draft and marking it
# ready seconds later delivers both events, the concurrency group below cancels
# one of them, and if the surviving run is the draft-event one it skips every
# shard and reports success. A job skipped by `if:` reports Success and does not
# block merge even when the check is required, so that head could merge with the
# knowledge, migration identity, CI classification and diff hygiene contracts
# never having executed (issue #417, observed on PR #416 head 9e77ad86).
#
# Path classification is the real risk signal and `scripts/classify-ci-changes.mjs`
# is its single authority, as AGENTS.md states. Gating on it alone means the
# checks a change needs run whenever that change exists, draft or not, and the
# rule is stated once instead of eight times. Do not reintroduce a draft
# condition: any fix that trusts the event payload has this race again.

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_verify: ${{ steps.classify.outputs.full_verify }}
      database: ${{ steps.classify.outputs.database }}
      browser_smoke: ${{ steps.classify.outputs.browser_smoke }}
      ui_audit: ${{ steps.classify.outputs.ui_audit }}
      codeql: ${{ steps.classify.outputs.codeql }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect changed files
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          else
            : > changed-files.txt
          fi
          cat changed-files.txt
      - name: Select risk-proportional gates
        id: classify
        env:
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: node scripts/classify-ci-changes.mjs < changed-files.txt
      - name: Selection summary
        env:
          REASON: ${{ steps.classify.outputs.reason }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          FULL_VERIFY: ${{ steps.classify.outputs.full_verify }}
          DATABASE: ${{ steps.classify.outputs.database }}
          BROWSER_SMOKE: ${{ steps.classify.outputs.browser_smoke }}
          UI_AUDIT: ${{ steps.classify.outputs.ui_audit }}
          CODEQL: ${{ steps.classify.outputs.codeql }}
        run: |
          {
            echo "## CI selection"
            echo
            echo "- Reason: $REASON"
            echo "- Documentation only: $DOCS_ONLY"
            echo "- Full verify: $FULL_VERIFY"
            echo "- Database: $DATABASE"
            echo "- Browser smoke: $BROWSER_SMOKE"
            echo "- UI audit: $UI_AUDIT"
            echo "- CodeQL: $CODEQL"
          } >> "$GITHUB_STEP_SUMMARY"

  verify_policy:
    name: Verify policy contracts
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git show --check --oneline --no-renames HEAD >/dev/null
          fi
      - name: Migration identity contract
        run: npm run check:migrations
      - name: Project knowledge contract
        run: npm run check:knowledge
      - name: CI classification and retry contract
        run: npm run test:ci-policy

  verify_static:
    name: Verify static quality
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Deployment configuration contract
        run: npm run check:deployment-env
      - name: CSS ownership and debt budgets
        run: npm run check:css-ownership
      - name: Architecture boundary contract
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  verify_tests:
    name: Verify unit tests and static RLS
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests and static RLS
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run test > test-output.log 2>&1
      - name: Upload failing test output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failing-test-output-${{ github.run_attempt }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving diagnostics
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Test summary
        if: steps.tests.outcome == 'success'
        run: tail -n 40 test-output.log

  verify_build:
    name: Verify production build
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:code-css-ownership reads the approved baseline from git history
          # (merge base with origin/main). A shallow checkout has no origin/main,
          # and the gate fails closed rather than passing without history.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      # Runs here, not in the static shard, because ownership is read from the
      # real bundle. The alternatives were a hand-maintained Tailwind allowlist
      # (rots, hides defects) or a second build in the static job (doubles CI
      # time for the same answer). This reuses the build that already ran.
      - name: Presentation ownership (code → CSS)
        run: npm run check:code-css-ownership

  verify:
    if: always()
    needs: [classify, verify_policy, verify_static, verify_tests, verify_build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required shard results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_VERIFY: ${{ needs.classify.outputs.full_verify }}
          POLICY_RESULT: ${{ needs.verify_policy.result }}
          STATIC_RESULT: ${{ needs.verify_static.result }}
          TEST_RESULT: ${{ needs.verify_tests.result }}
          BUILD_RESULT: ${{ needs.verify_build.result }}
        run: |
          set -euo pipefail

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$label finished with result '$result'"
              return 1
            fi
          }

          require_success "classify" "$CLASSIFY_RESULT"
          require_success "verify_policy" "$POLICY_RESULT"

          if [[ "$FULL_VERIFY" == "true" ]]; then
            require_success "verify_static" "$STATIC_RESULT"
            require_success "verify_tests" "$TEST_RESULT"
            require_success "verify_build" "$BUILD_RESULT"
          else
            echo "Heavy application verification was not selected; skipped shards are accepted."
          fi

  database:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Database checks not required
        if: needs.classify.outputs.database != 'true'
        run: echo "No database, migration, RLS, or database-CI contract changed."
      # The archive round-trip step below runs the R5 validator, which is
      # TypeScript executed through Node's type stripping. No npm install is
      # needed: it imports only repository modules.
      - name: Setup Node
        if: needs.classify.outputs.database == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup Supabase CLI
        if: needs.classify.outputs.database == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - name: Fresh local reset and pgTAP
        if: needs.classify.outputs.database == 'true'
        id: database-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            supabase --version
            supabase db start
            supabase db reset --local
            supabase test db
          } 2>&1 | tee database-test-output.log
      - name: Upload failing database output
        if: steps.database-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failing-database-test-output-${{ github.run_attempt }}
          path: database-test-output.log
          if-no-files-found: error
          retention-days: 1
      # R6 acceptance proof: real tenant state through the archive producer and
      # into the R5 validator, with no reshaping in between. pgTAP proves the
      # database boundary; this proves the producer satisfies the archive
      # contract that lives in TypeScript.
      - name: Archive producer round trip
        if: needs.classify.outputs.database == 'true' && steps.database-tests.outcome == 'success'
        id: archive-round-trip
        shell: bash
        run: npm run verify:archive-producer
      # R7 acceptance proof: the restored tenant's own archive must satisfy the
      # same contract, so the whole chain is verified end to end.
      - name: Archive restore round trip
        if: needs.classify.outputs.database == 'true' && steps.database-tests.outcome == 'success'
        id: archive-restore-round-trip
        shell: bash
        run: npm run verify:archive-round-trip
      - name: Stop local Supabase
        if: always() && needs.classify.outputs.database == 'true'
        run: supabase stop --no-backup || true
      - name: Fail after preserving diagnostics
        if: steps.database-tests.outcome == 'failure'
        run: exit 1
      - name: Database test summary
        if: steps.database-tests.outcome == 'success'
        run: tail -n 80 database-test-output.log

  browser_smoke:
    name: Browser smoke
    if: needs.classify.outputs.browser_smoke == 'true'
    needs: [classify, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_AUTH_CAPTCHA_ENABLED: "true"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Expense and Auth CAPTCHA browser smoke
        run: npm run test:e2e
      # Demo mode is correct behaviour for browser-local storage, so ownership
      # defects on the authenticated path are invisible to the step above. This
      # runs the same app in authenticated mode against the loopback double in
      # e2e/auth/supabase-double.mjs. No Supabase credentials, no provider or
      # production write, and a failure blocks this shard like any other.
      - name: Authenticated ownership browser smoke
        run: npm run test:e2e:auth
      - name: Upload browser-smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload authenticated-smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-auth/
          if-no-files-found: ignore
          retention-days: 3

  ui_audit:
    name: Cross-device UI audit
    if: needs.classify.outputs.ui_audit == 'true'
    needs: [classify, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_AUTH_CAPTCHA_ENABLED: "true"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Production cross-device UI audit
        run: npm run test:ui-audit:pr
      - name: Upload UI-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-audit/
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    if: always()
    needs: [classify, verify, browser_smoke, ui_audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required browser shard results
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_REQUIRED: ${{ needs.classify.outputs.browser_smoke }}
          BROWSER_RESULT: ${{ needs.browser_smoke.result }}
          UI_AUDIT_REQUIRED: ${{ needs.classify.outputs.ui_audit }}
          UI_AUDIT_RESULT: ${{ needs.ui_audit.result }}
        run: |
          set -euo pipefail

          require_selected_success() {
            local label="$1"
            local required="$2"
            local result="$3"

            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::$label was selected but finished with result '$result'"
              return 1
            fi

            if [[ "$required" != "true" ]]; then
              echo "$label was not selected; result '$result' is accepted."
            fi
          }

          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::verify finished with result '$VERIFY_RESULT'"
            exit 1
          fi

          require_selected_success "browser_smoke" "$BROWSER_REQUIRED" "$BROWSER_RESULT"
          require_selected_success "ui_audit" "$UI_AUDIT_REQUIRED" "$UI_AUDIT_RESULT"
