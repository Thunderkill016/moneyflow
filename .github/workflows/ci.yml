name: Temporary prebuilt production deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: prebuilt-shell-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: github.head_ref == 'agent/prebuilt-deploy-shell-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: thunderkill016s-projects
      EXPECTED_COMMIT: c79cd836ef75eaf2080ee145bae3f873c9523c95
    steps:
      - name: Checkout exact UI fix commit
        uses: actions/checkout@v4
        with:
          ref: c79cd836ef75eaf2080ee145bae3f873c9523c95
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Confirm source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Verify repository secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Link MoneyFlow project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@57.0.0 link \
            --yes \
            --project moneyflow \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Pull Vercel project settings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@57.0.0 pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          test -s .vercel/project.json

      - name: Resolve public production build configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin fb640d34ccead9597a66c2b1612a9fef87321986
          git show fb640d34ccead9597a66c2b1612a9fef87321986:vercel.json > /tmp/moneyflow-legacy-vercel.json

          node <<'NODE' > .production-build.env
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/moneyflow-legacy-vercel.json', 'utf8'));
          const source = config.build?.env ?? config.env ?? {};
          const values = {
            NEXT_PUBLIC_APP_MODE: 'authenticated',
            NEXT_PUBLIC_SUPABASE_URL: source.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: source.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            NEXT_PUBLIC_SITE_URL: 'https://mfvn.vercel.app',
            LEGACY_SITE_HOSTS: 'moneyflow-vn.vercel.app',
          };
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || value.length === 0) {
              throw new Error(`missing_public_build_value:${key}`);
            }
            if (/\r|\n/.test(value)) throw new Error(`invalid_public_build_value:${key}`);
            process.stdout.write(`${key}=${value}\n`);
          }
          NODE
          chmod 600 .production-build.env

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . ./.production-build.env
          set +a
          npm run check:deployment-env

      - name: Create temporary Vercel build config
        shell: bash
        run: |
          cat > vercel.ci.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs",
            "buildCommand": "set -a && . ./.production-build.env && set +a && npm run check:deployment-env && npm run build"
          }
          JSON

      - name: Build prebuilt production output
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@57.0.0 build \
            --prod \
            --local-config vercel.ci.json \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee vercel-build.log

      - name: Upload failing build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-prebuilt-shell-build
          path: vercel-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Deploy prebuilt production output
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@57.0.0 deploy \
            --prebuilt \
            --prod \
            --archive=split-tgz \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee vercel-deploy.log

          deployment_url=$(grep -Eo 'https://[-a-zA-Z0-9.]+\.vercel\.app' vercel-deploy.log | tail -n 1)
          test -n "$deployment_url"
          printf '%s\n' "$deployment_url" > deployment-url.txt
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Upload failing deploy diagnostics
        if: steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-prebuilt-shell-deploy
          path: |
            vercel-build.log
            vercel-deploy.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after deploy failure
        if: steps.deploy.outcome == 'failure'
        run: exit 1

      - name: Point canonical and legacy aliases at new deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url='${{ steps.deploy.outputs.deployment_url }}'
          npx --yes vercel@57.0.0 alias set "$deployment_url" mfvn.vercel.app \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee canonical-alias.log
          npx --yes vercel@57.0.0 alias set "$deployment_url" moneyflow-vn.vercel.app \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee legacy-alias.log

      - name: Verify public production behavior
        id: public-verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sleep 5
          canonical='https://mfvn.vercel.app'
          legacy='https://moneyflow-vn.vercel.app'
          deployment_url='${{ steps.deploy.outputs.deployment_url }}'

          deployment_status=$(curl --silent --show-error --location \
            --output deployment-login.html --write-out '%{http_code}' \
            "$deployment_url/login")
          canonical_root_status=$(curl --silent --show-error --location \
            --output canonical-root.html --write-out '%{http_code}' \
            "$canonical/")
          canonical_login_status=$(curl --silent --show-error --location \
            --output canonical-login.html --write-out '%{http_code}' \
            "$canonical/login")
          curl --silent --show-error --output /dev/null \
            --dump-header legacy-headers.txt "$legacy/"

          legacy_status=$(awk 'NR==1 { print $2 }' legacy-headers.txt)
          legacy_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' legacy-headers.txt)

          {
            printf 'source_commit=%s\n' "$EXPECTED_COMMIT"
            printf 'deployment_url=%s\n' "$deployment_url"
            printf 'deployment_login_status=%s\n' "$deployment_status"
            printf 'canonical_root_status=%s\n' "$canonical_root_status"
            printf 'canonical_login_status=%s\n' "$canonical_login_status"
            printf 'legacy_status=%s\n' "$legacy_status"
            printf 'legacy_location=%s\n' "$legacy_location"
          } | tee production-verification.log

          test "$deployment_status" = '200'
          test "$canonical_root_status" = '200'
          test "$canonical_login_status" = '200'
          case "$legacy_status" in
            301|302|303|307|308) ;;
            *) exit 1 ;;
          esac
          case "$legacy_location" in
            "$canonical"*) ;;
            *) exit 1 ;;
          esac

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-shell-production-evidence
          path: |
            deployment-url.txt
            vercel-build.log
            vercel-deploy.log
            canonical-alias.log
            legacy-alias.log
            production-verification.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail when public verification failed
        if: steps.public-verify.outcome == 'failure'
        run: exit 1
