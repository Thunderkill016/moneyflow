name: Domain ownership diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

concurrency:
  group: domain-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect-domains:
    if: github.head_ref == 'agent/emergency-prebuilt-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Inspect canonical and legacy Vercel domains
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== canonical inspect ==='
            npx --yes vercel@latest inspect https://mfvn.vercel.app \
              --scope thunderkill016s-projects --token "$VERCEL_TOKEN" || true
            echo
            echo '=== legacy inspect ==='
            npx --yes vercel@latest inspect https://moneyflow-vn.vercel.app \
              --scope thunderkill016s-projects --token "$VERCEL_TOKEN" || true
            echo
            echo '=== projects ==='
            npx --yes vercel@latest project ls \
              --scope thunderkill016s-projects --token "$VERCEL_TOKEN" || true
            echo
            echo '=== canonical headers ==='
            curl --silent --show-error --output /dev/null --dump-header - \
              https://mfvn.vercel.app/
            echo
            echo '=== legacy headers ==='
            curl --silent --show-error --output /dev/null --dump-header - \
              https://moneyflow-vn.vercel.app/
          } 2>&1 | tee domain-diagnostics.log

      - name: Upload domain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-diagnostics
          path: domain-diagnostics.log
          if-no-files-found: error
          retention-days: 1
