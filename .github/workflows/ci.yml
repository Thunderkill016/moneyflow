name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Draft state deliberately gates nothing here.
#
# Jobs used to carry
#   github.event_name != 'pull_request'
#     || github.event.action == 'ready_for_review'
#     || github.event.pull_request.draft == false
# in eight places. That reads the draft flag out of the run's own event payload,
# which can already be stale: opening a pull request as a draft and marking it
# ready seconds later delivers both events, the concurrency group below cancels
# one of them, and if the surviving run is the draft-event one it skips every
# shard and reports success. A job skipped by `if:` reports Success and does not
# block merge even when the check is required, so that head could merge with the
# knowledge, migration identity, CI classification and diff hygiene contracts
# never having executed (issue #417, observed on PR #416 head 9e77ad86).
#
# Path classification is the real risk signal and `scripts/classify-ci-changes.mjs`
# is its single authority. Gating on it alone means the
# checks a change needs run whenever that change exists, draft or not, and the
# rule is stated once instead of eight times. Do not reintroduce a draft
# condition: any fix that trusts the event payload has this race again.

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_verify: ${{ steps.classify.outputs.full_verify }}
      database: ${{ steps.classify.outputs.database }}
      codeql: ${{ steps.classify.outputs.codeql }}
      mobile: ${{ steps.classify.outputs.mobile }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect changed files
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          else
            : > changed-files.txt
          fi
          cat changed-files.txt
      - name: Select risk-proportional gates
        id: classify
        env:
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: node scripts/classify-ci-changes.mjs < changed-files.txt
      - name: Selection summary
        env:
          REASON: ${{ steps.classify.outputs.reason }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          FULL_VERIFY: ${{ steps.classify.outputs.full_verify }}
          DATABASE: ${{ steps.classify.outputs.database }}
          CODEQL: ${{ steps.classify.outputs.codeql }}
          MOBILE: ${{ steps.classify.outputs.mobile }}
        run: |
          {
            echo "## CI selection"
            echo
            echo "- Reason: $REASON"
            echo "- Documentation only: $DOCS_ONLY"
            echo "- Full verify: $FULL_VERIFY"
            echo "- Database: $DATABASE"
            echo "- CodeQL: $CODEQL"
            echo "- Mobile: $MOBILE"
          } >> "$GITHUB_STEP_SUMMARY"

  verify_policy:
    name: Verify policy contracts
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git show --check --oneline --no-renames HEAD >/dev/null
          fi
      - name: Migration identity contract
        run: npm run check:migrations
      - name: Deploy-context hygiene contract
        run: npm run check:deploy-hygiene
      - name: Workflow SHA pin contract
        run: npm run check:workflow-pins
      - name: CI classification and retry contract
        run: npm run test:ci-policy

  verify_static:
    name: Verify static quality
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Architecture boundary contract
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  verify_tests:
    name: Verify unit tests and static RLS
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests and static RLS
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run test > test-output.log 2>&1
      - name: Upload failing test output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failing-test-output-${{ github.run_attempt }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving diagnostics
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Test summary
        if: steps.tests.outcome == 'success'
        run: tail -n 40 test-output.log

  verify_build:
    name: Verify production build
    if: needs.classify.outputs.full_verify == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_MODE: authenticated
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key # gitleaks:allow test value
      NEXT_PUBLIC_SITE_URL: https://ci.example.test
      LEGACY_SITE_HOSTS: old-ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      # Runs here, not in the static shard, because ownership is read from the
      # real bundle. The alternatives were a hand-maintained Tailwind allowlist
      # (rots, hides defects) or a second build in the static job (doubles CI
      # time for the same answer). This reuses the build that already ran.

  verify_mobile:
    name: Verify Flutter mobile
    if: needs.classify.outputs.mobile == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mobile/.metadata pins the toolchain by git revision. Resolve it to the
      # matching published archive instead of a floating channel alias, then
      # assert the installed SDK reports that exact revision back.
      - name: Resolve the pinned Flutter SDK
        id: flutter-sdk
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(sed -n 's/^  revision: "\([0-9a-f]*\)"$/\1/p' mobile/.metadata | head -n 1)"
          if [[ -z "$REVISION" ]]; then
            echo "::error::mobile/.metadata does not pin a Flutter revision"
            exit 1
          fi
          curl -fsSL \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            -o /tmp/flutter-releases.json
          SDK_URL="$(FLUTTER_REVISION="$REVISION" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("/tmp/flutter-releases.json", "utf8"));
            const release = manifest.releases.find(
              (r) => r.hash === process.env.FLUTTER_REVISION && r.channel === "stable",
            );
            if (!release) {
              console.error(`No stable Linux release matches pinned revision ${process.env.FLUTTER_REVISION}`);
              process.exit(1);
            }
            console.log(`${manifest.base_url}/${release.archive}`);
          ')"
          echo "sdk_url=$SDK_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Install Flutter SDK
        shell: bash
        run: |
          curl -fsSL "${{ steps.flutter-sdk.outputs.sdk_url }}" -o /tmp/flutter-sdk.tar.xz
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          tar -xJf /tmp/flutter-sdk.tar.xz -C "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Assert the toolchain matches the pinned revision
        shell: bash
        run: |
          flutter --version
          flutter --version --machine > /tmp/flutter-version.json
          EXPECTED="${{ steps.flutter-sdk.outputs.revision }}" \
            node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const actual = JSON.parse(readFileSync("/tmp/flutter-version.json", "utf8")).frameworkRevision;
            if (actual !== process.env.EXPECTED) {
              console.error(`Flutter revision ${actual} does not match pinned ${process.env.EXPECTED}`);
              process.exit(1);
            }
            console.log(`Flutter ${actual} matches mobile/.metadata`);
          '
      - name: Locked dependency resolution
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test --no-pub
      # The debug APK exercises the Kotlin/Java compile and packaging path
      # without release signing. Endpoints are passed explicitly at the
      # acceptance sandbox — never production — and no secrets go into the
      # artifact.
      - name: Debug APK build against the acceptance sandbox
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=MF_AUTH_BASE_URL=https://ep-lively-sunset-b3xzqd47.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth \
            --dart-define=MF_DATA_API_URL=https://ep-lively-sunset-b3xzqd47.apirest.c-4.ap-southeast-1.aws.neon.tech/neondb/rest/v1
      # Pure-JVM tests for the Kotlin notification-source allowlist, quick
      # actions and widget snapshot contracts — no Robolectric, no device.
      # Runs after the APK build so local.properties and the Gradle cache are
      # already warm.
      - name: Kotlin JVM unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest

  verify:
    if: always()
    needs: [classify, verify_policy, verify_static, verify_tests, verify_build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required shard results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_VERIFY: ${{ needs.classify.outputs.full_verify }}
          POLICY_RESULT: ${{ needs.verify_policy.result }}
          STATIC_RESULT: ${{ needs.verify_static.result }}
          TEST_RESULT: ${{ needs.verify_tests.result }}
          BUILD_RESULT: ${{ needs.verify_build.result }}
        run: |
          set -euo pipefail

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$label finished with result '$result'"
              return 1
            fi
          }

          require_success "classify" "$CLASSIFY_RESULT"
          require_success "verify_policy" "$POLICY_RESULT"

          if [[ "$FULL_VERIFY" == "true" ]]; then
            require_success "verify_static" "$STATIC_RESULT"
            require_success "verify_tests" "$TEST_RESULT"
            require_success "verify_build" "$BUILD_RESULT"
          else
            echo "Heavy application verification was not selected; skipped shards are accepted."
          fi

  database:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Database checks not required
        if: needs.classify.outputs.database != 'true'
        run: echo "No database, migration, RLS, or database-CI contract changed."
      # The archive round-trip step below runs the R5 validator, which is
      # TypeScript executed through Node's type stripping. No npm install is
      # needed: it imports only repository modules.
      - name: Setup Node
        if: needs.classify.outputs.database == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup Supabase CLI
        if: needs.classify.outputs.database == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - name: Fresh local reset and pgTAP
        if: needs.classify.outputs.database == 'true'
        id: database-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            supabase --version
            supabase db start
            supabase db reset --local
            supabase test db
          } 2>&1 | tee database-test-output.log
      - name: Upload failing database output
        if: steps.database-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failing-database-test-output-${{ github.run_attempt }}
          path: database-test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce database test result
        if: needs.classify.outputs.database == 'true' && steps.database-tests.outcome != 'success'
        run: exit 1

  e2e:
    if: always()
    needs: [classify, verify, verify_mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required conditional shard results
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          MOBILE_REQUIRED: ${{ needs.classify.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.verify_mobile.result }}
        run: |
          set -euo pipefail

          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::verify finished with result '$VERIFY_RESULT'"
            exit 1
          fi

          if [[ "$MOBILE_REQUIRED" == "true" && "$MOBILE_RESULT" != "success" ]]; then
            echo "::error::verify_mobile was selected but finished with result '$MOBILE_RESULT'"
            exit 1
          fi

          if [[ "$MOBILE_REQUIRED" != "true" ]]; then
            echo "verify_mobile was not selected; result '$MOBILE_RESULT' is accepted."
          fi
