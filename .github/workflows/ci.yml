name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and static RLS
        run: npm run test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build
