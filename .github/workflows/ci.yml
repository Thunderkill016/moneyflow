name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh performance lockfile"
          git push origin HEAD:${{ github.head_ref }}

  database:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Fresh local reset and pgTAP
        id: database-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            supabase --version
            supabase db start
            supabase db reset --local
            supabase test db
          } 2>&1 | tee database-test-output.log
      - name: Upload failing database output
        if: steps.database-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-database-test-output
          path: database-test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
      - name: Fail after preserving database diagnostics
        if: steps.database-tests.outcome == 'failure'
        run: exit 1
      - name: Database test summary
        if: steps.database-tests.outcome == 'success'
        run: tail -n 80 database-test-output.log

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and static RLS
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run test > test-output.log 2>&1
      - name: Upload failing test output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving diagnostics
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Test summary
        if: steps.tests.outcome == 'success'
        run: tail -n 40 test-output.log
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build
