name: Readiness source artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readiness-source-artifact.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude='*.env*' \
            --exclude='.github/workflows/readiness-source-artifact.yml' \
            -czf moneyflow-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneyflow-source
          path: moneyflow-source.tgz
          if-no-files-found: error
          retention-days: 1
