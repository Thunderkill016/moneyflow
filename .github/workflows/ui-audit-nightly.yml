name: UI audit nightly

on:
  schedule:
    - cron: "23 19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ui-audit-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Firefox critical-route audit
        run: npm run test:ui-audit:firefox
      - name: Upload Firefox audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-audit/
          if-no-files-found: ignore
          retention-days: 7
