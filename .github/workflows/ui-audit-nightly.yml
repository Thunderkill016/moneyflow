name: UI audit nightly

on:
  schedule:
    - cron: "23 19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ui-audit-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Firefox critical-route audit
        run: npm run test:ui-audit:firefox
      - name: Upload Firefox audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-audit/
          if-no-files-found: ignore
          retention-days: 7
