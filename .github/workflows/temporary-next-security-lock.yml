name: Temporary Next security lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/next-security-update'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/next-security-update
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Capture runtime audit
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/runtime-audit.json || true
          npm ls next postcss sharp --all --json > artifacts/runtime-tree.json || true
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: lock Next.js security release"
          git push origin HEAD:fix/next-security-update
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-security-audit
          path: artifacts
          if-no-files-found: error
          retention-days: 2
