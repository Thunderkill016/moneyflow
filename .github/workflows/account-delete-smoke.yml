name: Temporary account deletion smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify self-service account deletion
        shell: bash
        run: |
          set +e
          node scripts/account-delete-runtime-smoke.mjs > account-delete-smoke.log 2>&1
          status=$?
          cat account-delete-smoke.log
          exit $status
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-delete-smoke-diagnostics
          path: account-delete-smoke.log
          if-no-files-found: error
          retention-days: 1
