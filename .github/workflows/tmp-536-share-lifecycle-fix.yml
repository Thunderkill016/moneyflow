name: Temporary #536 share lifecycle fix

on:
  push:
    branches:
      - security/536-runtime-dependency-patch
    paths:
      - .github/workflows/tmp-536-share-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/536-runtime-dependency-patch
      - name: Apply bounded compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/inbox/capture-share-page.tsx')
          text = path.read_text()
          old = '''    const frame = window.requestAnimationFrame(() => {
      // React Strict Mode can run setup -> cleanup -> setup in development.
      // Mark this one-shot as consumed only after a frame actually starts;
      // otherwise the first cleanup can cancel the frame and strand the route.
'''
          new = '''    window.requestAnimationFrame(() => {
      // React Strict Mode can run setup -> cleanup -> setup in development.
      // Keep the queued frame alive across that replay; whichever frame starts
      // first consumes the one-shot and the duplicate exits via ranRef.
'''
          if old not in text:
              raise SystemExit('expected requestAnimationFrame block not found')
          text = text.replace(old, new, 1)
          old_cleanup = '    return () => window.cancelAnimationFrame(frame);\n'
          if old_cleanup not in text:
              raise SystemExit('expected requestAnimationFrame cleanup not found')
          text = text.replace(old_cleanup, '', 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-536-share-lifecycle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/inbox/capture-share-page.tsx .github/workflows/tmp-536-share-lifecycle-fix.yml
          git commit -m "fix(capture): keep share ingestion alive across effect replay"
          git push origin HEAD:security/536-runtime-dependency-patch
