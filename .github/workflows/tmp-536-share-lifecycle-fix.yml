name: Temporary 536 share lifecycle fix

on:
  push:
    branches:
      - security/536-runtime-dependency-patch
    paths:
      - .github/workflows/tmp-536-share-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/536-runtime-dependency-patch
      - name: Apply bounded compatibility fix
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/components/inbox/capture-share-page.tsx'); t=p.read_text(); old='    const frame = window.requestAnimationFrame(() => {\\n      // React Strict Mode can run setup -> cleanup -> setup in development.\\n      // Mark this one-shot as consumed only after a frame actually starts;\\n      // otherwise the first cleanup can cancel the frame and strand the route.\\n'; new='    window.requestAnimationFrame(() => {\\n      // React Strict Mode can run setup -> cleanup -> setup in development.\\n      // Keep the queued frame alive across that replay; whichever frame starts\\n      // first consumes the one-shot and the duplicate exits via ranRef.\\n'; assert old in t, 'expected requestAnimationFrame block not found'; t=t.replace(old,new,1); cleanup='    return () => window.cancelAnimationFrame(frame);\\n'; assert cleanup in t, 'expected requestAnimationFrame cleanup not found'; p.write_text(t.replace(cleanup,'',1))"
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-536-share-lifecycle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/inbox/capture-share-page.tsx .github/workflows/tmp-536-share-lifecycle-fix.yml
          git commit -m "fix(capture): keep share ingestion alive across effect replay"
          git push origin HEAD:security/536-runtime-dependency-patch
