name: Temporary production readiness PR smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'agent/verify-production-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated production smoke
        env:
          READINESS_EMAIL: moneyflow-browser-15551e7a-1ed@example.com
          READINESS_PASSWORD: Mf!3adff288a7a54be1bf8485acAa1
        run: |
          mkdir -p artifacts
          python scripts/temporary-patch-production-readiness.py
          node scripts/temporary-production-readiness.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-evidence
          path: artifacts
          if-no-files-found: error
          retention-days: 3
