name: CI docs-only database probe

on:
  pull_request:
    branches: [ci-probe/database-skip-base]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-docs-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.classify.outputs.database }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" > changed-files.txt
      - name: Select risk-proportional gates
        id: classify
        run: node scripts/classify-ci-changes.mjs < changed-files.txt
      - name: Require documentation-only classification
        shell: bash
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          DATABASE: ${{ steps.classify.outputs.database }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          set -euo pipefail
          echo "Reason: $REASON"
          [[ "$DOCS_ONLY" == "true" ]]
          [[ "$DATABASE" == "false" ]]

  database_checks:
    name: Probe database executor
    if: needs.classify.outputs.database == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0
      - name: Unexpected database execution
        run: |
          echo "::error::Documentation-only probe unexpectedly selected database execution."
          exit 1

  database:
    name: Probe stable database summary
    if: always()
    needs: [classify, database_checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify skipped executor result
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DATABASE_REQUIRED: ${{ needs.classify.outputs.database }}
          DATABASE_RESULT: ${{ needs.database_checks.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$DATABASE_REQUIRED" == "false" ]]
          [[ "$DATABASE_RESULT" == "skipped" ]]
          echo "Documentation-only diff skipped the database executor and preserved a stable successful summary."
