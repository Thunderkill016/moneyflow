name: Provider Sync Free Dry Run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  simulate-provider-history:
    if: github.event.pull_request.head.ref == 'agent/provider-sync-free-dry-run' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Simulate production migration history and dry-run
        shell: bash
        run: |
          set -euo pipefail

          production_tail="20260802022923"
          expected_moneyflow=(
            20260802060004_cover_foreign_key_indexes.sql
            20260803090000_transaction_review_bulk_correction.sql
            20260803142000_account_reconciliation_current_main.sql
            20260803144500_account_reconciliation_ci_hardening.sql
            20260803153000_account_reconciliation_workspace_read_model.sql
            20260804110000_authenticated_deterministic_rules.sql
            20260804160000_financial_mutation_audit.sql
            20260804160100_financial_read_plan_indexes.sql
            20260804160200_financial_audit_service_role_inspection.sql
            20260804160300_financial_audit_request_id_token.sql
          )
          remote_only_atoryn=(
            20260804171954_create_atoryn_design_agent_bridge
            20260804184225_atoryn_design_cloud_v07
            20260804184624_atoryn_design_cloud_lockdown
            20260805050340_atoryn_native_editor_direct_control_v1
            20260805050355_atoryn_native_editor_project_metadata_v1
            20260805050413_atoryn_native_editor_activity_metadata_v1
            20260805050429_atoryn_native_editor_list_commands_v1
          )

          cleanup() {
            supabase stop --no-backup >/dev/null 2>&1 || true
            for migration in "${remote_only_atoryn[@]}"; do
              rm -f "supabase/migrations/${migration}.sql"
            done
          }
          trap cleanup EXIT

          echo "Supabase CLI: $(supabase --version)"
          echo "Simulated production MoneyFlow tail: ${production_tail}"

          for migration in "${remote_only_atoryn[@]}"; do
            path="supabase/migrations/${migration}.sql"
            if [[ -e "$path" ]]; then
              echo "::error::Expected remote-only Atoryn migration to be absent locally: $path"
              exit 1
            fi
            printf '%s\n' '-- Remote-only history placeholder for branch-local selection simulation.' > "$path"
          done

          supabase db start
          supabase db reset --local --version "$production_tail" --no-seed

          atoryn_versions=()
          for migration in "${remote_only_atoryn[@]}"; do
            atoryn_versions+=("${migration%%_*}")
          done
          supabase migration repair "${atoryn_versions[@]}" --status applied --local

          echo "=== Simulated union migration history ==="
          supabase migration list --local | tee provider-sync-migration-list.log

          echo "=== Supabase CLI dry-run ==="
          supabase db push --local --include-all --dry-run 2>&1 | tee provider-sync-dry-run.log

          mapfile -t dry_run_migrations < <(
            grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' provider-sync-dry-run.log || true
          )

          if [[ "${#dry_run_migrations[@]}" -ne "${#expected_moneyflow[@]}" ]]; then
            echo "::error::Expected ${#expected_moneyflow[@]} dry-run migrations, found ${#dry_run_migrations[@]}"
            printf 'Dry-run: %s\n' "${dry_run_migrations[*]:-<none>}"
            exit 1
          fi

          for index in "${!expected_moneyflow[@]}"; do
            if [[ "${dry_run_migrations[$index]}" != "${expected_moneyflow[$index]}" ]]; then
              echo "::error::Dry-run migration mismatch at index $index: expected ${expected_moneyflow[$index]}, found ${dry_run_migrations[$index]}"
              exit 1
            fi
          done

          for migration in "${remote_only_atoryn[@]}"; do
            version="${migration%%_*}"
            if grep -q "$version" provider-sync-dry-run.log; then
              echo "::error::Dry-run attempted already-applied Atoryn migration version $version"
              exit 1
            fi
          done

          echo "Provider Sync free dry-run selected exactly the 10 reviewed MoneyFlow migrations."
