name: tmp-536-audit-evidence

on:
  push:
    branches:
      - security/536-runtime-dependency-patch

permissions:
  contents: write

jobs:
  patch-audit-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/536-runtime-dependency-patch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Pin patched qs and harden dependency guard
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...pkg.overrides, qs: '6.16.0' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/dependency-security.test.ts')
          text = path.read_text()
          marker = 'const MIN_BROWSERSLIST = "4.28.7";'
          if marker not in text:
              raise SystemExit('MIN_BROWSERSLIST marker not found')
          text = text.replace(marker, marker + '\nconst MIN_QS = "6.16.0"; // GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g', 1)
          override_marker = 'assert.equal(packageJson.overrides?.browserslist, "4.28.8");'
          if override_marker not in text:
              raise SystemExit('browserslist override assertion not found')
          text = text.replace(override_marker, override_marker + '\n  assert.equal(packageJson.overrides?.qs, "6.16.0");', 1)
          loop_marker = '''    if (/(?:^|\\/)node_modules\\/browserslist$/.test(path)) {
      assert.ok(
        isAtLeast(installed.version ?? "0.0.0", MIN_BROWSERSLIST),
        `${path} resolves browserslist ${installed.version}, below ${MIN_BROWSERSLIST}`,
      );
    }
'''
          if loop_marker not in text:
              raise SystemExit('browserslist loop guard not found')
          text = text.replace(loop_marker, loop_marker + '''    if (/(?:^|\\/)node_modules\\/qs$/.test(path)) {
      assert.ok(
        isAtLeast(installed.version ?? "0.0.0", MIN_QS),
        `${path} resolves qs ${installed.version}, below ${MIN_QS}`,
      );
    }
''', 1)
          path.write_text(text)
          PY
      - name: Regenerate lock with repository package-manager semantics
        run: npm install --package-lock-only --ignore-scripts
      - name: Restore exact shipped tree
        run: npm ci
      - name: Require zero npm audit findings
        run: |
          set +e
          npm audit --json > audit.json
          audit_status=$?
          set -e
          cat audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log(`AUDIT_COUNTS info=${v.info ?? 0} low=${v.low ?? 0} moderate=${v.moderate ?? 0} high=${v.high ?? 0} critical=${v.critical ?? 0} total=${v.total ?? 0}`);
          if ((v.total ?? 0) !== 0) process.exit(1);
          if (process.env.AUDIT_STATUS !== '0') process.exit(1);
          NODE
        env:
          AUDIT_STATUS: "0"
      - name: Verify dependency security guard
        run: node --experimental-strip-types --test src/lib/dependency-security.test.ts
      - name: Commit verified remediation and self-delete
        run: |
          rm .github/workflows/tmp-536-audit-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/lib/dependency-security.test.ts .github/workflows/tmp-536-audit-evidence.yml
          git diff --cached --check
          git commit -m "fix(security): patch qs advisory"
          git push origin HEAD:security/536-runtime-dependency-patch
