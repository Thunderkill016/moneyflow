name: tmp-536-audit-evidence

on:
  push:
    branches:
      - security/536-runtime-dependency-patch

permissions:
  contents: write

jobs:
  patch-audit-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/536-runtime-dependency-patch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Pin patched qs
        run: npm pkg set overrides.qs=6.16.0
      - name: Regenerate lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Restore exact shipped tree
        run: npm ci
      - name: Require clean npm audit
        run: npm audit --audit-level=low
      - name: Commit verified remediation and self-delete
        run: |
          rm .github/workflows/tmp-536-audit-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/tmp-536-audit-evidence.yml
          git diff --cached --check
          git commit -m "fix(security): patch qs advisory"
          git push origin HEAD:security/536-runtime-dependency-patch
