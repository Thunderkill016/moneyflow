<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:13px Inter,system-ui;background:#111827;color:#e5e7eb}main{padding:16px}h1{font-size:17px;margin:0 0 4px}p{color:#94a3b8;line-height:1.45}label{display:grid;gap:5px;margin:12px 0;color:#cbd5e1}input{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc}button{width:100%;padding:10px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.card{border:1px solid #263449;border-radius:11px;padding:11px;margin-top:12px;background:#0b1220}.status{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}.dot.on{background:#22c55e;box-shadow:0 0 12px #22c55e}.dot.err{background:#ef4444}.log{font:11px ui-monospace,monospace;white-space:pre-wrap;max-height:210px;overflow:auto;color:#94a3b8}.mode{display:inline-block;font-size:10px;background:#082f49;color:#7dd3fc;border-radius:99px;padding:4px 7px;margin-bottom:8px}</style></head><body><main><span class="mode">PENPOT CLOUD · BRIDGE 0.8</span><h1>Atoryn Agent Bridge</h1><p>Flex, typography, tokens, components and governed AI commands.</p><label>Project slug<input id="project" value="moneyflow-design"></label><label>Project token<input id="token" type="password" placeholder="Paste project token"></label><button id="connect">Connect</button><div class="card status"><span id="dot" class="dot"></span><div><b id="state">Disconnected</b><p id="context">Waiting for Penpot context…</p></div></div><div class="card"><b>Activity</b><pre id="log" class="log">Ready.</pre></div></main><script>
const ENDPOINT="https://fwpldsdkpzhswpuctbke.supabase.co/functions/v1/atoryn-design-cloud";
const APIKEY="sb_publishable_JsTNKJSp1AFD747bBmyTDg_pEPj_HVZ";
const $=(s)=>document.querySelector(s);let timer=null,last=0,busy=false;const log=(x)=>{$("#log").textContent=`${new Date().toLocaleTimeString()} ${x}\n`+$("#log").textContent.slice(0,5000)};const setState=(text,kind="")=>{$("#state").textContent=text;$("#dot").className="dot "+kind};
function send(message){parent.postMessage(message,"*")}
function auth(){const projectSlug=$("#project").value.trim(),projectToken=$("#token").value.trim();if(!projectSlug||!projectToken)throw new Error("Project slug and token are required");return{projectSlug,projectToken}}
async function call(route,body={}){const r=await fetch(`${ENDPOINT}/${route}`,{method:"POST",headers:{apikey:APIKEY,Authorization:`Bearer ${APIKEY}`,"content-type":"application/json"},body:JSON.stringify(body),cache:"no-store"});const p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.error||`Cloud API failed (${r.status})`);return p}
async function acknowledge(result){const a=auth();await call("commands/ack",{...a,commandId:Number(result.commandId),status:result.status,result:{fileId:result.fileId,fileRevision:result.fileRevision,pageId:result.pageId,results:result.results,validationErrors:result.validationErrors},error:result.error||null,actor:"penpot-cloud-plugin-v0.8"})}
window.addEventListener("message",async(event)=>{const m=event.data;if(m?.type==="bridge:context"){$("#context").textContent=`${m.fileName} · ${m.pageName||"No page"} · v${m.pluginVersion||"?"}`;return}if(m?.type!=="bridge:result")return;const r=m.result;try{await acknowledge(r);last=Math.max(last,Number(r.sequence||0));localStorage.setItem("atoryn-cloud-bridge-v08",JSON.stringify({...auth(),last}));log(`${r.status}: command ${r.sequence}${r.error?" · "+r.error:""}`)}catch(e){log("Ack failed: "+e.message)}finally{busy=false}});
async function poll(){if(busy)return;try{const a=auth();const commands=await call("commands/list",{...a,after:last,limit:10});setState("Bridge online","on");for(const command of commands){if(command.status!=="queued"){last=Math.max(last,Number(command.sequence));continue}busy=true;log(`Applying command ${command.sequence} · ${command.risk}`);send({type:"bridge:apply",command});break}}catch(e){setState("Connection error","err");log(e.message)}}
$("#connect").onclick=async()=>{clearInterval(timer);try{const a=auth();const project=await call("project",a);localStorage.setItem("atoryn-cloud-bridge-v08",JSON.stringify({...a,last}));setState("Bridge online","on");log(`Connected: ${project.name}`);await poll();timer=setInterval(poll,1200)}catch(e){setState("Connection error","err");log(e.message)}};
try{const saved=JSON.parse(localStorage.getItem("atoryn-cloud-bridge-v08"));if(saved){$("#project").value=saved.projectSlug||"moneyflow-design";$("#token").value=saved.projectToken||"";last=Number(saved.last||0)}}catch{}send({type:"bridge:hello"});
</script></body></html>
